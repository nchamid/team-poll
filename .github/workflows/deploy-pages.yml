name: Deploy demo to GitHub Pages

# Builds the web frontend in DEMO mode (VITE_DEMO_MODE=true) — an in-memory
# mock API with synthetic data, no Entra sign-in, no backend — and publishes it
# to GitHub Pages. This is a public showcase of the UI only; it never serves real
# firm data and is separate from the governed Azure + Entra production deploy.
#
# Prerequisite (one-time, repo owner): Settings → Pages → Source = "GitHub Actions".

on:
  push:
    branches:
      - dev
    paths:
      - 'web/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

# Action majors verified live against the registry on 2026-06-28
# (checkout@v7, setup-node@v6, configure-pages@v6, upload-pages-artifact@v5,
# deploy-pages@v5). Re-verify before bumping — never pin from memory (ci-pipeline.md).

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./web
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build demo bundle
        env:
          VITE_DEMO_MODE: 'true'
        run: npm run build:demo
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
